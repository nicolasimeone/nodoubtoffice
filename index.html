<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodoubt Office</title>
<meta name="description" content="Nodoubt Office — creative consulting, design and direction. Currently available for new projects.">
<meta name="theme-color" content="#0b0b0b">

<style>
@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayRoman.ttf") format("truetype");
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayMediu.ttf") format("truetype");
  font-weight: 500;
  font-display: swap;
}

@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayBold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #0b0b0b;
  --fg: #f4f4f0;
  --grey: rgb(189, 189, 189);
  --line: #3a3a37;
  --accent: #d4ff3a;
  --pad: clamp(20px, 3vw, 40px);
  --gutter: 24px;
  --section: clamp(72px, 8vw, 120px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Neue Haas Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 700;
  letter-spacing: -0.04em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.15s;
}

a:hover,
a:focus-visible {
  color: var(--grey);
}

a:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}

/* Grid: 4 columns, one gutter, one margin, used by every row */

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--gutter);
  padding-inline: var(--pad);
}

.full {
  grid-column: 1 / -1;
}

.rule {
  grid-column: 1 / -1;
  border-top: 1px solid var(--line);
}

.small {
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/* Header */

.header {
  padding-block: 24px;
  align-items: baseline;
  white-space: nowrap;
}

.brand {
  grid-column: 1 / span 2;
  justify-self: start;
}

.nav {
  grid-column: 3;
  display: flex;
  gap: var(--gutter);
}

.status {
  grid-column: 4;
  justify-self: end;
  color: var(--accent);
}

.status::before {
  content: "";
  display: inline-block;
  width: 0.5em;
  height: 0.5em;
  margin-right: 0.5em;
  background: var(--accent);
}

/* Hero */

.hero {
  padding-top: clamp(24px, 4vw, 48px);
}

.wordmark {
  grid-column: 1 / span 2;
}

.wordmark svg {
  display: block;
  width: 100%;
  height: auto;
  fill: currentColor;
}

/* Desktop: the straight edge of the D (x = 112.53 of 226.77) sits on the end of column 1 */
@media (min-width: 769px) {
  .wordmark svg {
    width: calc((100% - var(--gutter)) / 2 * 226.77 / 112.53);
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.intro {
  margin-top: 32px;
  padding-top: 16px;
  font-size: clamp(20px, 1.8vw, 26px);
  line-height: 1.1;
}

.intro p {
  grid-column: span 2;
}

.intro p + p {
  color: var(--grey);
}

/* Services */

.services {
  padding-top: var(--section);
}

.label {
  margin-bottom: 16px;
  font-weight: 700;
  color: var(--grey);
}

.services ol {
  list-style: none;
  display: grid;
  grid-template-columns: inherit;
  column-gap: var(--gutter);
}

.services li {
  border-top: 1px solid var(--line);
  font-size: 24px;
  line-height: 1.2;
}

.svc {
  display: flex;
  gap: 16px;
  align-items: baseline;
  width: 100%;
  padding: 12px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-align: left;
  cursor: default;
  transition: color 0.15s;
}

.svc:hover,
.svc:focus-visible,
.svc[aria-expanded="true"] {
  color: var(--grey);
}

.svc:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}

.has-img .svc {
  cursor: pointer;
}

.services li span {
  min-width: 24px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--grey);
  font-variant-numeric: tabular-nums;
}

/* Service images: desktop preview sits on a grid column next to the hovered item */

.preview {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  display: block;
  height: auto;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}

.preview.is-visible {
  opacity: 1;
}

/* Touch: image opens below the tapped item */

.services li img {
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: 12px;
}

/* Contact */

.contact {
  padding-top: var(--section);
  padding-bottom: 24px;
}

.contact-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 40px;
  font-size: clamp(30px, 5.6vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.035em;
}

.contact-links a {
  align-self: flex-start;
  margin-left: -0.031em;
}

.footer {
  padding-top: 16px;
  color: var(--grey);
}

.footer span {
  grid-column: span 3;
}

.footer .top {
  grid-column: 4;
  justify-self: end;
}

.footer a:hover,
.footer a:focus-visible {
  color: var(--fg);
}

@media (max-width: 1099px) {
  .services li {
    grid-column: span 2;
  }
}

@media (max-width: 768px) {
  :root {
    --gutter: 12px;
  }

  .small {
    font-size: clamp(11.5px, 3.6vw, 14px);
  }

  .brand {
    display: none;
  }

  .nav {
    display: contents;
  }

  .wordmark,
  .intro p,
  .services li {
    grid-column: 1 / -1;
  }

  .services li {
    font-size: 20px;
  }

  /* Phone: the whole logo runs from the left grid edge to the start of column 3, where Client Login begins */
  .wordmark svg {
    width: calc(50% + var(--gutter) / 2);
  }

  .contact-links {
    font-size: 8.2vw;
  }
}
</style>
</head>

<body id="top">

<main>

        <circle cx="188.98" cy="37.8" r="37.8"/>

<img class="preview" alt="" aria-hidden="true">

<script>
(function () {
  var DIR = "services/";
  var EXT = ".jpg";
  var hover = window.matchMedia("(hover: hover) and (pointer: fine)");
  var preview = document.querySelector(".preview");
  var items = document.querySelectorAll(".services li");
  var current = null;

  function src(n) {
    return DIR + n + EXT;
  }

  // Mark items whose image exists, without downloading the images
  items.forEach(function (li) {
    var n = li.querySelector(".svc").dataset.n;
    fetch(src(n), { method: "HEAD" })
      .then(function (r) {
        if (r.ok) li.classList.add("has-img");
      })
      .catch(function () {});
  });

  // Desktop: show the image on the neighbouring grid column
  function place(li) {
    var r = li.getBoundingClientRect();
    var gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gutter")) || 24;
    var list = li.parentElement.getBoundingClientRect();
    var w = r.width;
    var x = r.right + gutter;
    if (x + w > list.right + 1) x = r.left - gutter - w;
    if (x < list.left - 1) x = list.right - w;
    preview.style.width = w + "px";
    var h = preview.naturalWidth ? w * preview.naturalHeight / preview.naturalWidth : w * 1.25;
    var y = r.top + r.height / 2 - h / 2;
    y = Math.max(16, Math.min(y, window.innerHeight - h - 16));
    preview.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }

  function show(li) {
    if (!hover.matches || !li.classList.contains("has-img")) return;
    current = li;
    var url = src(li.querySelector(".svc").dataset.n);
    if (preview.getAttribute("src") !== url) {
      preview.classList.remove("is-visible");
      preview.onload = function () {
        if (current === li) {
          place(li);
          preview.classList.add("is-visible");
        }
      };
      preview.setAttribute("src", url);
    } else {
      place(li);
      preview.classList.add("is-visible");
    }
  }

  function hide() {
    current = null;
    preview.classList.remove("is-visible");
  }

  items.forEach(function (li) {
    var btn = li.querySelector(".svc");
    li.addEventListener("mouseenter", function () { show(li); });
    li.addEventListener("mouseleave", hide);
    btn.addEventListener("focus", function () { show(li); });
    btn.addEventListener("blur", hide);

    // Touch: tap opens the image below the item, one at a time
    btn.addEventListener("click", function () {
      if (hover.matches || !li.classList.contains("has-img")) return;
      var open = btn.getAttribute("aria-expanded") === "true";
      document.querySelectorAll('.svc[aria-expanded="true"]').forEach(function (b) {
        b.setAttribute("aria-expanded", "false");
        var img = b.parentElement.querySelector("img");
        if (img) img.remove();
      });
      if (open) return;
      var img = document.createElement("img");
      img.src = src(btn.dataset.n);
      img.alt = btn.textContent.replace(/^\d+/, "").trim();
      li.appendChild(img);
      btn.setAttribute("aria-expanded", "true");
    });
  });

  window.addEventListener("scroll", hide, { passive: true });
  window.addEventListener("resize", hide);
})();
</script>

</body>
</html>
