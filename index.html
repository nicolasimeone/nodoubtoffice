<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodoubt Office</title>
<meta name="description" content="Nodoubt Office — creative consulting, design and direction. Currently available for new projects.">
<meta name="theme-color" content="#0b0b0b">

<style>
@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayRoman.ttf") format("truetype");
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayMediu.ttf") format("truetype");
  font-weight: 500;
  font-display: swap;
}

@font-face {
  font-family: "Neue Haas Display";
  src: url("./NeueHaasDisplayBold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #0b0b0b;
  --fg: #f4f4f0;
  --grey: rgb(189, 189, 189);
  --line: #3a3a37;
  --accent: #d4ff3a;
  --pad: clamp(20px, 3vw, 40px);
  --gutter: 24px;
  --section: clamp(72px, 8vw, 120px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Neue Haas Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 700;
  letter-spacing: -0.04em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.15s;
}

a:hover,
a:focus-visible {
  color: var(--grey);
}

a:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}

/* Grid: 4 columns, one gutter, one margin, used by every row */

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--gutter);
  padding-inline: var(--pad);
}

.full {
  grid-column: 1 / -1;
}

.rule {
  grid-column: 1 / -1;
  border-top: 1px solid var(--line);
}

.small {
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/* Header */

.header {
  padding-block: 24px;
  align-items: baseline;
  white-space: nowrap;
}

.brand {
  grid-column: 1 / span 2;
  justify-self: start;
}

.nav {
  grid-column: 3;
  display: flex;
  gap: var(--gutter);
}

.status {
  grid-column: 4;
  justify-self: end;
  color: var(--accent);
}

.status::before {
  content: "";
  display: inline-block;
  width: 0.5em;
  height: 0.5em;
  margin-right: 0.5em;
  background: var(--accent);
}

/* Hero */

.hero {
  padding-top: clamp(24px, 4vw, 48px);
}

.wordmark {
  grid-column: 1 / span 2;
}

.wordmark svg {
  display: block;
  width: 100%;
  height: auto;
  fill: currentColor;
}

/* Load screen with the logo; the rule sits right under the header */

.hero {
  padding-top: 0;
}

.wordmark svg {
  display: none;
}

.hero .rule {
  margin-top: 0 !important;
}

.loader {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: var(--bg);
  animation: loader-out 0.6s ease 1.8s forwards;
}

.loader svg {
  display: block;
  width: clamp(150px, 16vw, 280px);
  height: auto;
  fill: var(--fg);
  animation: logo-in 0.7s ease 0.15s both;
}

/* Mobile menu: hidden on desktop */

.menu-toggle,
.mobile-menu {
  display: none;
}

@keyframes logo-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

@keyframes loader-out {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

@media (prefers-reduced-motion: reduce) {
  .loader {
    animation-delay: 0.8s;
    animation-duration: 0.3s;
  }

  .loader svg {
    animation: none;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.intro {
  margin-top: 32px;
  padding-top: 16px;
  font-size: clamp(20px, 1.8vw, 26px);
  line-height: 1.1;
}

.intro p {
  grid-column: span 2;
}

.intro p + p {
  color: var(--grey);
}

/* Services */

.services {
  padding-top: var(--section);
}

.label {
  margin-bottom: 16px;
  font-weight: 700;
  color: var(--grey);
}

.services ol {
  list-style: none;
  display: grid;
  grid-template-columns: inherit;
  column-gap: var(--gutter);
}

.services li {
  border-top: 1px solid var(--line);
  font-size: 24px;
  line-height: 1.2;
}

.svc {
  display: flex;
  gap: 16px;
  align-items: baseline;
  width: 100%;
  padding: 12px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-align: left;
  cursor: default;
  transition: color 0.15s;
}

.svc:hover,
.svc:focus-visible,
.svc[aria-expanded="true"] {
  color: var(--grey);
}

.svc:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}

.has-img .svc {
  cursor: pointer;
}

.services li span {
  min-width: 24px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--grey);
  font-variant-numeric: tabular-nums;
}

/* Service images: desktop preview sits on a grid column next to the hovered item */

.preview {
  position: fixed;
  overflow: hidden;
  top: 0;
  left: 0;
  z-index: 10;
  display: block;
  height: auto;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}

.preview.is-visible {
  opacity: 1;
}

.preview img {
  display: block;
  width: 100%;
  height: auto;
}

/* Video items: 16:9 frame */

.preview.is-video,
.inline-video {
  aspect-ratio: 16 / 9;
  background: var(--bg);
}

.inline-video {
  position: relative;
}

.preview.is-video img,
.services .inline-video img {
  position: absolute;
  inset: 0;
  height: 100%;
  object-fit: cover;
}

.preview iframe,
.inline-video iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  transition: opacity 0.3s;
}

.preview iframe.is-ready,
.inline-video iframe.is-ready {
  opacity: 1;
}

.inline-video {
  margin-bottom: 12px;
}

.services .inline-video img {
  margin: 0;
}

/* Touch: image opens below the tapped item */

.services li img {
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: 12px;
}

/* Contact */

.contact {
  padding-top: var(--section);
  padding-bottom: 24px;
}

/* Desktop: the contact block stays pinned to the bottom of the window */
@media (min-width: 769px) {
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  main {
    flex: 1 0 auto;
    padding-bottom: var(--section);
  }

  .contact {
    position: sticky;
    bottom: 0;
    z-index: 5;
    padding-top: 24px;
    background: var(--bg);
  }
}

.contact-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 40px;
  font-size: clamp(30px, 5.6vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.035em;
}

.contact-links a {
  align-self: flex-start;
  margin-left: -0.031em;
}

.footer {
  padding-top: 16px;
  color: var(--grey);
}

.footer span {
  grid-column: span 3;
}

.footer .top {
  grid-column: 4;
  justify-self: end;
}

.footer a:hover,
.footer a:focus-visible {
  color: var(--fg);
}

@media (max-width: 1099px) {
  .services li {
    grid-column: span 2;
  }
}

@media (max-width: 768px) {
  :root {
    --gutter: 12px;
  }

  .small {
    font-size: clamp(11.5px, 3.6vw, 14px);
  }

  .brand,
  .nav {
    display: none;
  }

  .header {
    position: relative;
    z-index: 60;
    align-items: center;
  }

  .menu-toggle {
    grid-column: 1;
    justify-self: start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    width: 44px;
    height: 44px;
    margin: -14px 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
    cursor: pointer;
  }

  .menu-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    background: currentColor;
    transition: transform 0.2s;
  }

  .menu-toggle[aria-expanded="true"] span:first-child {
    transform: translateY(4px) rotate(45deg);
  }

  .menu-toggle[aria-expanded="true"] span:last-child {
    transform: translateY(-4px) rotate(-45deg);
  }

  .menu-toggle:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }

  .status {
    grid-column: 4;
    justify-self: end;
  }

  .mobile-menu {
    position: fixed;
    inset: 0;
    z-index: 50;
    padding: 65px var(--pad) 24px;
    background: var(--bg);
    overflow-y: auto;
  }

  .mobile-menu.is-open {
    display: block;
  }

  .mobile-menu a {
    display: block;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.04em;
  }

  body.menu-open {
    overflow: hidden;
  }

  .wordmark,
  .intro p,
  .services li {
    grid-column: 1 / -1;
  }

  .services li {
    font-size: 20px;
  }

  .contact-links {
    font-size: 8.2vw;
  }
}
</style>

<script>
(function () {
  var DIR = "services/";
  var EXT = ".jpg";

  // Services that show a YouTube video instead of an image: number → video ID
  var VIDEOS = {
    "25": "UGikIBK8BAw"
  };

  var hover = window.matchMedia("(hover: hover) and (pointer: fine)");
  var preview = document.querySelector(".preview");
  var previewImg = preview.querySelector("img");
  var items = document.querySelectorAll(".services li");
  var current = null;
  var players = {};

  function src(n) {
    return DIR + n + EXT;
  }

  function embed(id, controls) {
    return "https://www.youtube-nocookie.com/embed/" + id +
      "?autoplay=1&mute=1&loop=1&playlist=" + id +
      "&controls=" + (controls ? 1 : 0) +
      "&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin);
  }

  function makeFrame(id, controls) {
    var f = document.createElement("iframe");
    f.src = embed(id, controls);
    f.title = "Video";
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.setAttribute("tabindex", "-1");
    f.addEventListener("load", function () {
      setTimeout(function () {
        f.classList.add("is-ready");
        if (f.onready) f.onready();
      }, 600);
    });
    return f;
  }

  function command(frame, func) {
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify({ event: "command", func: func, args: [] }), "*");
    }
  }

  // Mark items that have media, without downloading the images
  items.forEach(function (li) {
    var n = li.querySelector(".svc").dataset.n;
    if (VIDEOS[n]) {
      li.classList.add("has-img");
      return;
    }
    fetch(src(n), { method: "HEAD" })
      .then(function (r) {
        if (r.ok) li.classList.add("has-img");
      })
      .catch(function () {});
  });

  // Desktop: show the media on the neighbouring grid column
  function place(li, ratio) {
    var r = li.getBoundingClientRect();
    var gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gutter")) || 24;
    var list = li.parentElement.getBoundingClientRect();
    var w = r.width;
    var x = r.right + gutter;
    if (x + w > list.right + 1) x = r.left - gutter - w;
    if (x < list.left - 1) x = list.right - w;
    preview.style.width = w + "px";
    var h = w * ratio;
    var y = r.top + r.height / 2 - h / 2;
    y = Math.max(16, Math.min(y, window.innerHeight - h - 16));
    preview.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }

  function pauseAll() {
    Object.keys(players).forEach(function (k) {
      command(players[k], "pauseVideo");
      players[k].style.display = "none";
    });
  }

  function show(li) {
    if (!hover.matches || !li.classList.contains("has-img")) return;
    current = li;
    var n = li.querySelector(".svc").dataset.n;
    var url = src(n);
    pauseAll();

    if (VIDEOS[n]) {
      preview.classList.add("is-video");
      previewImg.style.display = "none";
      place(li, 9 / 16);
      var frame = players[n];
      if (!frame) {
        frame = players[n] = makeFrame(VIDEOS[n], false);
        preview.classList.remove("is-visible");
        preview.appendChild(frame);
      } else {
        frame.style.display = "";
        command(frame, "playVideo");
      }
      if (frame.classList.contains("is-ready")) {
        preview.classList.add("is-visible");
      } else {
        frame.onready = function () {
          if (current === li) preview.classList.add("is-visible");
        };
      }
      return;
    }

    preview.classList.remove("is-video");
    previewImg.style.display = "";
    if (previewImg.getAttribute("src") !== url) {
      preview.classList.remove("is-visible");
      previewImg.onload = function () {
        if (current === li) {
          place(li, previewImg.naturalHeight / previewImg.naturalWidth);
          preview.classList.add("is-visible");
        }
      };
      previewImg.setAttribute("src", url);
    } else {
      place(li, previewImg.naturalHeight / previewImg.naturalWidth || 1.25);
      preview.classList.add("is-visible");
    }
  }

  function hide() {
    current = null;
    preview.classList.remove("is-visible");
    pauseAll();
  }

  function closeInline() {
    document.querySelectorAll('.svc[aria-expanded="true"]').forEach(function (b) {
      b.setAttribute("aria-expanded", "false");
      var media = b.parentElement.querySelector("img, .inline-video");
      if (media) media.remove();
    });
  }

  items.forEach(function (li) {
    var btn = li.querySelector(".svc");
    li.addEventListener("mouseenter", function () { show(li); });
    li.addEventListener("mouseleave", hide);
    btn.addEventListener("focus", function () { show(li); });
    btn.addEventListener("blur", hide);

    // Touch: tap opens the media below the item, one at a time
    btn.addEventListener("click", function () {
      if (hover.matches || !li.classList.contains("has-img")) return;
      var open = btn.getAttribute("aria-expanded") === "true";
      closeInline();
      if (open) return;
      var n = btn.dataset.n;
      var label = btn.textContent.replace(/^\d+/, "").trim();
      if (VIDEOS[n]) {
        var box = document.createElement("div");
        box.className = "inline-video";
        var f = makeFrame(VIDEOS[n], true);
        f.title = label;
        f.removeAttribute("tabindex");
        box.appendChild(f);
        li.appendChild(box);
      } else {
        var img = document.createElement("img");
        img.src = src(n);
        img.alt = label;
        li.appendChild(img);
      }
      btn.setAttribute("aria-expanded", "true");
    });
  });

  window.addEventListener("scroll", hide, { passive: true });
  window.addEventListener("resize", hide);
})();
</script>

<script>
(function () {
  var toggle = document.querySelector(".menu-toggle");
  var menu = document.getElementById("mobile-menu");

  function setOpen(open) {
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "Close menu" : "Menu");
    menu.classList.toggle("is-open", open);
    document.body.classList.toggle("menu-open", open);
  }

  toggle.addEventListener("click", function () {
    setOpen(toggle.getAttribute("aria-expanded") !== "true");
  });

  menu.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", function () { setOpen(false); });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menu.classList.contains("is-open")) {
      setOpen(false);
      toggle.focus();
    }
  });

  window.matchMedia("(min-width: 769px)").addEventListener("change", function (e) {
    if (e.matches) setOpen(false);
  });
})();
</script>

</body>
</html>
